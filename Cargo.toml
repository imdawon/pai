[package]
name = "pai"
version = "0.1.0"
edition = "2024"
description = "Gives coding tools a Privacy AI day credential without a long-lived API key"
license = "MIT"

[dependencies]
pai-proto = { path = "../pai-relay/crates/pai-proto" }
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = "4.2"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
rand = "0.8"
gethostname = "1"
zeroize = "1"

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
