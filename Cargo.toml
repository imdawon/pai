[package]
name = "pai"
version = "0.1.0"
edition = "2024"
description = "Gives coding tools a DawonAI day credential without a long-lived API key"
license = "MIT"

[dependencies]
pai-proto = { path = "../pai-relay/crates/pai-proto" }
clap = { version = "4.6", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.11"
base64 = "0.23"
keyring = "4.2"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
rand = "0.8"
gethostname = "1"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
axum = "0.8"
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "service"] }
http-body-util = "0.1"
bytes = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
